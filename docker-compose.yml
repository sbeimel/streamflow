services:
  stream-checker:
    image: sbeimel/streamflow-mod:latest
    build:
      context: .
      dockerfile: Dockerfile.multi-stage
    ports:
      - "5000:5000"   # Flask API (serves both API and static frontend)
    volumes:
      - /srv/docker/databases/stream_checker:/app/data
    env_file:
      - .env
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=5000
      - CONFIG_DIR=/app/data
      
      # Server Mode: "false" = Gunicorn (production), "true" = Flask dev server (debug)
      - DEBUG_MODE=false
      
      # Gunicorn Configuration (only used when DEBUG_MODE=false)
      # Workers: Recommended = (2 × CPU cores) + 1
      # For Multi-Channel with 10 concurrent channels, use 8-12 workers
      - GUNICORN_WORKERS=8
      - GUNICORN_THREADS=2
      - GUNICORN_TIMEOUT=120
      
      # Alternative: Specify environment variables directly instead of using .env file
      # Uncomment the lines below and comment out 'env_file' section to use env vars only
      # - DISPATCHARR_BASE_URL=http://your-dispatcharr-instance.com:9191
      # - DISPATCHARR_USER=your-username
      # - DISPATCHARR_PASS=your-password
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - streamflow-network

networks:
  streamflow-network:
    driver: bridge
